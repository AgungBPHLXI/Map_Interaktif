<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">

    <title>INFORMASI SPASIAL BPHL Wilayah XI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS APLIKASI -->
    <link rel="stylesheet" href="assets/css/main.css">

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon_bphl_pro_32.png"
    >

    <!-- LEAFLET CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    >

    <!-- LEAFLET ROUTING CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    >

    <!-- SELECT2 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
        rel="stylesheet"
    >

</head>


<body>

    <!-- =========================
         MAP
    ========================== -->
    <div id="map"></div>


    <!-- =========================
         CHART OVERLAY
    ========================== -->
    <div id="chartOverlay">

        <button id="btnCloseChart">✖</button>

        <canvas id="chartKawasan"></canvas>

        <canvas id="chartSemua"></canvas>

    </div>


    <!-- =========================
         SIDEBAR
    ========================== -->
    <div id="sidebar">


        <!-- HEADER -->
        <div class="sidebar-header">

            <div class="logo-area">

                <img src="logo-kemenhut.png">

                <div class="sidebar-title">

                    <div class="main-title">
                        BPHL XI Banjarbaru
                    </div>

                    <div class="sub-title">
                        Kementerian Kehutanan RI
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             MONITORING
        ========================== -->
        <div class="menu-group">

            <div
                class="menu-parent"
                onclick="toggleMenu(this)"
            >
                📊 Monitoring ▼
            </div>


            <div class="menu-child">

                <div onclick="loadKawasan(); closeSidebarMobile()">
                    Luas Kawasan Hutan
                </div>

                <div onclick="loadPenanaman(); closeSidebarMobile()">
                    Penanaman PBPH
                </div>

                <div onclick="loadProduksi(); closeSidebarMobile()">
                    Produksi PBPH
                </div>

                <div onclick="loadProduksiIndustri(); closeSidebarMobile()">
                    Produksi Industri 6000 UP
                </div>
                
                <div onclick="loadHotspotSipongi(); closeSidebarMobile()">
                🔥 Hotspot Karhutla Kalsel
                </div>

            </div>

        </div>


        <!-- =========================
             FILTER
        ========================== -->
        <div class="menu-group">

            <div
                class="menu-parent"
                onclick="toggleMenu(this)"
            >
                🔎 Filter ▼
            </div>


            <div class="menu-child">

                <!-- FILTER KABUPATEN -->
                <label>Kabupaten</label>

                <select
                    id="filterKabupaten"
                    multiple
                ></select>


                <!-- FILTER KAWASAN -->
                <label>Kawasan</label>

                <select
                    id="filterF2025"
                    multiple
                ></select>


                <!-- FILTER PBPH -->
                <label>PBPH</label>

                <select
                    id="filterNama"
                    multiple
                ></select>


                <!-- FILTER INDUSTRI -->
                <label>Industri 6000 UP</label>

                <select
                    id="filterIndustri"
                    multiple
                ></select>
                <!-- =========================
     FILTER HOTSPOT SIPONGI
========================== -->

<div id="hotspotFilterPanel"
     style="
        margin-top:15px;
        padding:12px;
        background:#f5f5f5;
        border-radius:8px;
        border:1px solid #ddd;
     ">

    <div style="
        font-weight:bold;
        margin-bottom:10px;
    ">
        🔥 Filter Hotspot
    </div>


    <!-- HIGH -->

    <label style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-bottom:8px;
        cursor:pointer;
    ">

        <input
            type="checkbox"
            id="filterHotspotHigh"
            checked
            onchange="updateHotspotFilter()"
        >

        <span style="
            width:12px;
            height:12px;
            background:#e53935;
            border-radius:50%;
            display:inline-block;
        "></span>

        High

    </label>


    <!-- MEDIUM -->

    <label style="
        display:flex;
        align-items:center;
        gap:8px;
        margin-bottom:8px;
        cursor:pointer;
    ">

        <input
            type="checkbox"
            id="filterHotspotMedium"
            checked
            onchange="updateHotspotFilter()"
        >

        <span style="
            width:12px;
            height:12px;
            background:#fbc02d;
            border-radius:50%;
            display:inline-block;
        "></span>

        Medium

    </label>


    <!-- LOW -->

    <label style="
        display:flex;
        align-items:center;
        gap:8px;
        cursor:pointer;
    ">

        <input
            type="checkbox"
            id="filterHotspotLow"
            checked
            onchange="updateHotspotFilter()"
        >

        <span style="
            width:12px;
            height:12px;
            background:#43a047;
            border-radius:50%;
            display:inline-block;
        "></span>

        Low

    </label>

</div>

                <!-- =========================
                     UPLOAD SHAPEFILE
                ========================== -->
                <label>Upload SHP (.zip)</label>

                <input
                    type="file"
                    id="uploadShp"
                    accept=".zip"
                    style="
                        width:100%;
                        padding:6px;
                        border-radius:6px;
                        border:1px solid #ccc;
                        background:white;
                    "
                >


                <!-- INFO FORMAT SHP -->
                <div
                    style="
                        font-size:11px;
                        color:#555;
                        margin-top:6px;
                        line-height:1.5;
                        background:#f5f5f5;
                        padding:8px;
                        border-radius:6px;
                    "
                >

                    <b>Format Upload:</b>
                    <br>

                    File harus dalam bentuk <b>.zip</b>
                    <br>

                    dan berisi file:
                    <br>

                    • .shp
                    <br>

                    • .dbf
                    <br>

                    • .shx
                    <br>

                    • .prj

                </div>


                <!-- =========================
                     PANEL POWERPOINT
                ========================== -->
                <div
                    id="pptInfo"
                    style="display:none; margin-top:15px;"
                >

                    <img
                        src="Slide1.1.png"
                        class="slide-img"
                    >

                    <img
                        src="Slide2.png"
                        class="slide-img"
                    >

                    <img
                        src="Slide3.png"
                        class="slide-img"
                    >

                    <img
                        src="Slide4.png"
                        class="slide-img"
                    >

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         TOGGLE SIDEBAR
    ========================== -->
    <button id="toggleSidebar">☰</button>


    <!-- =========================
         JAVASCRIPT LIBRARIES
    ========================== -->

    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- LEAFLET -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- LEAFLET ROUTING -->
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- SELECT2 -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- SHAPEFILE -->
    <script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>


    <!-- =========================
         MODUL APLIKASI
    ========================== -->

   <!-- KONFIGURASI -->
<script src="assets/js/config.js"></script>

<!-- MODUL PETA -->
<script src="assets/js/map.js"></script>

<!-- APLIKASI UTAMA -->
<script src="assets/js/app.js"></script>


</body>
</html>
