name: Update Hotspot Harian

on:

  # Jalankan otomatis setiap hari
  # 00:30 UTC = 08:30 WITA
  schedule:
    - cron: "30 0 * * *"

  # Bisa dijalankan manual dari GitHub
  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-hotspot:

    runs-on: ubuntu-latest


    steps:

      # ================================================
      # AMBIL SOURCE CODE REPOSITORY
      # ================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ================================================
      # INSTALL NODE.JS
      # ================================================

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: "20"


      # ================================================
      # CEK VERSI NODE
      # ================================================

      - name: Cek Node.js

        run: node --version


      # ================================================
      # JALANKAN UPDATE HOTSPOT
      # ================================================

      - name: Update data hotspot

        run: node scripts/update-hotspot.js


      # ================================================
      # CEK HASIL DATA
      # ================================================

      - name: Cek hasil update

        run: |

          echo "Isi folder data:"
          ls -lah data/

          echo "Isi folder hotspot harian:"
          ls -lah data/hotspot-harian/ || true


      # ================================================
      # SIMPAN PERUBAHAN KE GITHUB
      # ================================================

      - name: Commit dan push data

        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit -m "Update data hotspot harian"

            git push

          fi
